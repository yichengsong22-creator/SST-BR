dataset:
  rhb_root: "data/RHB_train"

windowing:
  source_segment_seconds: 30
  local_window_seconds: 5
  windows_per_source_segment: 6
  source_segments_per_subject: 3
  radar_fs: 120
  ppg_fs: 30

ppg:
  filter_order: 6
  band_hz: [0.75, 2.5]
  periodogram_nfft: 18000
  hr_search_bpm: [45, 150]

radar:
  valid_range_m: [0.30, 2.00]
  psd_nfft: 4096

spatial:
  energy_threshold: 0.50
  energy_relaxed_threshold: 0.35
  tracking_short_segments: 5
  tracking_jump_penalty: 0.20
  tracking_low_hr_factor: 0.65

spectral:
  cardiac_band_hz: [0.75, 2.5]
  filterbank_k: [3, 4]
  subband_expansion_fraction: 0.10
  butter_order: 3
  low_hr_threshold_bpm: 65
  low_hr_factor: 0.75

temporal_fusion:
  statistics: [mean, median, sample_std, min, max, range]

models:
  baseline: {n_estimators: 500, max_depth: 4, min_samples_leaf: 6, min_samples_split: 2, max_features: 0.5, bootstrap: false, random_state: 44, n_jobs: -1}
  residual: {n_estimators: 500, max_depth: 6, min_samples_leaf: 10, min_samples_split: 2, max_features: 0.5, bootstrap: false, random_state: 57, n_jobs: -1}
  criteria:
    fold1: {et_criterion: absolute_error, rf_criterion: squared_error}
    fold2: {et_criterion: absolute_error, rf_criterion: squared_error}
    fold3: {et_criterion: squared_error, rf_criterion: absolute_error}
    fold4: {et_criterion: absolute_error, rf_criterion: absolute_error}
  residual_percentiles: [0.01, 0.99]
  residual_hard_clip_bpm: [-18, 18]
  final_hr_clip_bpm: [45, 130]

evaluation:
  scale_seconds: 10
  prediction_pair_reduction: arithmetic_mean
  ground_truth: direct_300_sample_ppg

paths:
  folds_dir: configs/folds
  ppg_cache_dir: cache/ppg
  radar_cache_dir: cache/radar_features
  models_dir: models
  outputs_dir: outputs

runtime:
  pipeline_version: sstbr-full-1.0
