[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sstbr"
version = "1.0.0"
description = "Full SST-BR source release for radar heart-rate estimation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy==2.4.3",
  "scipy==1.17.1",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
  "PyYAML==6.0.3",
  "matplotlib==3.10.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sstbr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
